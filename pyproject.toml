[project]
name = "sourcebook"
version = "0.1.0"
description = "Public, source-linked data pages about businesses, with CSV/JSON export and corrections."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["starlette>=0.37", "uvicorn>=0.29", "httpx>=0.27", "jinja2>=3.1", "beautifulsoup4>=4.12", "lxml>=5.0", "python-multipart>=0.0.9", "babel>=2.14", "itsdangerous>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["sourcebook*"]

[tool.setuptools.package-data]
sourcebook = ["templates/*.html", "static/*"]
